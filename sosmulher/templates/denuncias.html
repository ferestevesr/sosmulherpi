<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Denúncias</h1>
    <p>Se você tem informações sobre assédio ou violência doméstica, por favor, preencha o formulário abaixo:
    <form action="/denuncias" method="post">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>
        <label for="descricao">Descrição da denúncia:</label><br>
        <textarea id="descricao" name="descricao" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Enviar Denúncia">
    </p>
</body>
</html>
